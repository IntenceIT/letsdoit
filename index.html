<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#16a4a7" />
    <meta name="description" content="Task management app for teams" />
    
    <!-- Preconnect to Firebase -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <title>Lets Do It - Task Manager</title>
    
    <!-- Inline critical CSS to prevent flash -->
    <style>
      #root {
        min-height: 100vh;
        background: linear-gradient(180deg, hsl(180, 20%, 98%) 0%, hsl(180, 25%, 95%) 100%);
      }
      
      /* Loading screen */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom right, #eff6ff, #f3e8ff, #fce7f3);
      }
      
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(22, 164, 167, 0.2);
        border-top-color: #16a4a7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading indicator -->
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
